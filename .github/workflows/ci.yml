name: Cartly CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cartly
          POSTGRES_PASSWORD: cartly_password
          POSTGRES_DB: cartly_db
        ports:
          - 5433:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Push Database Schema
      run: npx prisma db push
      env:
        DATABASE_URL: postgresql://cartly:cartly_password@localhost:5433/cartly_db?schema=public

    - name: Run Lint
      run: npm run lint

    - name: Run Build
      run: npm run build

    - name: Run Unit Tests
      run: npm run test
      env:
        DATABASE_URL: postgresql://cartly:cartly_password@localhost:5433/cartly_db?schema=public
        REDIS_HOST: localhost
        REDIS_PORT: 6379
