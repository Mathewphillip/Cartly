version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cartly-postgres
    environment:
      POSTGRES_USER: cartly
      POSTGRES_PASSWORD: cartly_password
      POSTGRES_DB: cartly
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cartly-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartly-api
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://cartly:cartly_password@postgres:5432/cartly?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=super_secret_access
      - JWT_REFRESH_SECRET=super_secret_refresh
      - STRIPE_SECRET_KEY=sk_test_mock
      - STRIPE_WEBHOOK_SECRET=whsec_mock
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
